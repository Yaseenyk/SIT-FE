name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit — needed after
  # changing either NEXT_PUBLIC_* variable, since both are baked in at build time.
  workflow_dispatch:

# Read the repo, write a Pages deployment, and mint the OIDC token Pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a running deploy is allowed to
# FINISH rather than being killed halfway — a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: `node --test` runs the TypeScript test files directly, and type
          # stripping is only on by default from Node 23.6.
          node-version: 24
          cache: npm

      - run: npm ci

      # The gates. A site that does not typecheck is not published.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # ── Where this site will live ────────────────────────────────────────────
      #
      # `basePath` derives from NEXT_PUBLIC_SITE_URL, so getting it wrong does not fail
      # the build — it publishes a site whose every stylesheet and script 404s, which
      # looks like raw unstyled HTML. That is what happens when the variable is simply
      # unset: next.config.ts falls back to localhost:3000, whose pathname is empty, so
      # basePath becomes "" and assets resolve to the domain root.
      #
      # So the project-page URL is DERIVED from the repository by default, and the
      # variable is an override for a custom domain rather than a requirement.
      - name: Resolve site URL
        id: site
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
            echo "Using NEXT_PUBLIC_SITE_URL from repository variables."
          else
            # Pages lowercases the owner in the domain; the repo path keeps its case.
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            URL="https://${OWNER}.github.io/${{ github.event.repository.name }}"
            echo "No NEXT_PUBLIC_SITE_URL variable set — derived the project-page URL."
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Building for $URL"

      # Accounts fail CLOSED and visibly: without these the site still works for
      # visitors, and every account screen says so rather than throwing from inside a
      # form's submit handler. The warning is so nobody has to discover that from a user.
      - name: Warn if accounts are not configured
        if: vars.NEXT_PUBLIC_FIREBASE_API_KEY == ''
        run: |
          echo "::warning title=Accounts disabled::NEXT_PUBLIC_FIREBASE_API_KEY is unset, so sign-in, signup and password reset are unavailable on the published site. Set the NEXT_PUBLIC_FIREBASE_* variables under Settings > Secrets and variables > Actions > Variables, then re-run this workflow."

      - name: Warn if the API is not configured
        if: vars.NEXT_PUBLIC_API_BASE_URL == ''
        run: |
          echo "::warning title=No API configured::NEXT_PUBLIC_API_BASE_URL is unset, so the \
          site will call http://localhost:8080 and every section will show 'Could not load'. \
          Set it under Settings > Secrets and variables > Actions > Variables once the \
          backend is deployed, then re-run this workflow."

      - name: Build static export
        run: npm run build
        env:
          # Variables, not secrets: both are compiled into the JavaScript the browser
          # downloads, so neither is secret and masking them in logs would only make a
          # failed build harder to read.
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          # Firebase Auth's web config. VARIABLES, not secrets, and that is correct:
          # a browser cannot talk to Firebase Auth without them, and Google documents the
          # web API key as a public project identifier. It identifies the project and
          # authorises nothing — Firestore is never read from the browser, and the API
          # decides what a signed-in person may do from their `users` document.
          # The PRIVATE service-account key is a different thing and lives only on Render.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # basePath is the one thing that fails silently and only in production, so assert
      # it in CI rather than discovering it by looking at the published site.
      - name: Verify asset paths carry the basePath
        run: |
          EXPECTED=$(node -e 'process.stdout.write(new URL(process.argv[1]).pathname.replace(/\/$/, ""))' "${{ steps.site.outputs.url }}")
          if [ -z "$EXPECTED" ]; then
            echo "Custom domain (no basePath) — nothing to check."
            exit 0
          fi
          if grep -q "\"$EXPECTED/_next/" out/index.html; then
            echo "OK: assets are prefixed with $EXPECTED"
          else
            echo "::error title=basePath missing::Assets in out/index.html are not prefixed \
            with '$EXPECTED'. The published site would 404 every stylesheet and script."
            grep -o '"/[^"]*_next/static/[^"]*"' out/index.html | head -3
            exit 1
          fi

      # ── Make sure Pages is publishing THIS workflow, not Jekyll ──────────────
      #
      # Pages has two sources: "Deploy from a branch" (GitHub runs its own Jekyll build)
      # and "GitHub Actions" (this workflow). `enablement: true` below turns Pages on if
      # it is off, but it does NOT change the source of an already-enabled site — and a
      # site enabled that way defaults to the BRANCH source.
      #
      # The result is two publishers racing. GitHub's Jekyll build renders README.md and
      # deploys that; this workflow deploys the real site; whichever finishes last wins.
      # It did in fact alternate: one deploy served the site, the next served the README,
      # with nothing failing either time.
      #
      # So force the source to `workflow`. The token already carries pages:write for the
      # deployment below, and once set, GitHub stops running its Jekyll build entirely.
      - name: Ensure Pages is set to deploy from Actions
        run: |
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo "none")
          echo "Pages build_type is currently: $CURRENT"
          if [ "$CURRENT" = "workflow" ]; then
            echo "Already correct."
          elif [ "$CURRENT" = "none" ]; then
            echo "Pages not enabled yet — configure-pages will enable it below."
          else
            echo "Switching from '$CURRENT' to 'workflow' so Jekyll stops publishing over this site."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        # Advisory: if the token is not permitted to change this (an org policy, say), the
        # deploy should still run — and the manual fix is Settings → Pages → Source.
        continue-on-error: true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
